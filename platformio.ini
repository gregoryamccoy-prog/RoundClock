; ESP32 Round LCD Clock
; Target: ESP32-WROOM-32 dev board + Waveshare 1.28" GC9A01 240x240 LCD

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.embed_files = assets/face_background.rgb565

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DUSER_SETUP_LOADED=1
    -DGC9A01_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=27
    -DTFT_DC=26
    -DTFT_RST=25
    -DTFT_MISO=-1
    -DTOUCH_CS=-1
    -DTFT_RGB_ORDER=0
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=10000000
    -DLOAD_GLCD=1
    -DSMOOTH_FONT=1
    -I${PROJECT_DIR}


; Host test/emulation is intentionally dependency-free.
[env:native]
platform = native
test_build_src = yes
build_src_filter =
    +<core_logic.cpp>
    +<face_renderer.cpp>


